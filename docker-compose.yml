services:
  db:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: visual_inventory
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d visual_inventory"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/visual_inventory
      SIMILARITY_THRESHOLD: "0.25"
      YOLO_MODEL_PATH: yolov8n.pt
      YOLO_CLASSES: "41,44,46"
      CLIP_MODEL_NAME: openai/clip-vit-base-patch32
    ports:
      - "8000:8000"
    volumes:
      - model_cache:/root/.cache
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  postgres_data:
  model_cache:
