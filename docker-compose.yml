services:
  db:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: visual_inventory
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d visual_inventory"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/visual_inventory
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:8501,http://127.0.0.1:8501
      DETECTOR_BACKEND: yolo26
      FALLBACK_TO_YOLOV8: "true"
      DETECTOR_RECOGNIZED_CONFIDENCE_THRESHOLD: "0.60"
      DETECTOR_UNCERTAIN_CONFIDENCE_THRESHOLD: "0.45"
      SIMILARITY_RECOGNIZED_THRESHOLD: "0.15"
      SIMILARITY_UNKNOWN_THRESHOLD: "0.22"
      SIMILARITY_MARGIN_THRESHOLD: "0.03"
      TOP_K_CANDIDATES: "5"
      ENABLE_OCR: "false"
      OCR_ENGINE: easyocr
      IMAGE_SIMILARITY_WEIGHT: "0.70"
      TEXT_MATCH_WEIGHT: "0.25"
      CATEGORY_MATCH_WEIGHT: "0.05"
      OCR_MIN_MEANINGFUL_CHARS: "3"
      TEXT_MATCH_RERANK_THRESHOLD: "0.60"
      TEXT_MATCH_BONUS_MAX: "0.15"
      TEXT_CONFLICT_THRESHOLD: "0.15"
      CATEGORY_MATCH_BONUS_MAX: "0.03"
      HIGH_CONFIDENCE_THRESHOLD: "0.85"
      MEDIUM_CONFIDENCE_THRESHOLD: "0.70"
      YOLO_CONFIDENCE_THRESHOLD: "0.15"
      YOLO_IOU_THRESHOLD: "0.30"
      YOLO_MAX_DETECTIONS: "20"
      YOLO_MODEL_PATH: /models/warehouse.pt
      YOLO_CLASSES: ""
      YOLO_WORLD_MODEL: yolov8s-world.pt
      YOLO_WORLD_PROMPTS: product,industrial component,electrical component,small box,package,button switch,relay,connector,pneumatic fitting,plastic wrapped product
      YOLO_WORLD_CONFIDENCE: "0.20"
      YOLO_WORLD_IOU: "0.50"
      YOLO_WORLD_MAX_DETECTIONS: "30"
      MIN_DETECTION_AREA_RATIO: "0.002"
      MAX_DETECTION_AREA_RATIO: "0.95"
      MAX_DETECTIONS_PER_IMAGE: "30"
      RECOGNITION_FALLBACK_TO_FULL_IMAGE: "false"
      CLIP_MODEL_NAME: openai/clip-vit-base-patch32
      RECOGNITION_CANDIDATE_LIMIT: "5"
      REVIEW_STORAGE_DIR: /data/reviews
      YOLO_DATASET_DIR: /code/data/yolo_dataset
      PRODUCT_REFERENCE_DIR: /code/data/product_references
      MIN_CROP_DIMENSION_PX: "32"
      MIN_CROP_AREA_RATIO: "0.001"
      REGISTRATION_USE_DETECTOR_CROP: "false"
      REGISTRATION_FALLBACK_TO_FULL_IMAGE: "true"
    ports:
      - "8000:8000"
    volumes:
      - model_cache:/root/.cache
      - ./models:/models
      - ./data:/code/data
      - ./datasets:/code/datasets
      - review_data:/data/reviews
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      DETECTOR_UNCERTAIN_CONFIDENCE_THRESHOLD: "0.45"
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  postgres_data:
  model_cache:
  review_data:
