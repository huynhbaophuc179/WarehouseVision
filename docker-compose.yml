services:
  db:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: visual_inventory
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d visual_inventory"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/visual_inventory
      DETECTOR_RECOGNIZED_CONFIDENCE_THRESHOLD: "0.60"
      DETECTOR_UNCERTAIN_CONFIDENCE_THRESHOLD: "0.45"
      SIMILARITY_RECOGNIZED_THRESHOLD: "0.15"
      SIMILARITY_UNKNOWN_THRESHOLD: "0.22"
      SIMILARITY_MARGIN_THRESHOLD: "0.03"
      TOP_K_CANDIDATES: "5"
      ENABLE_OCR: "false"
      OCR_ENGINE: easyocr
      IMAGE_SIMILARITY_WEIGHT: "0.70"
      TEXT_MATCH_WEIGHT: "0.25"
      CATEGORY_MATCH_WEIGHT: "0.05"
      HIGH_CONFIDENCE_THRESHOLD: "0.85"
      MEDIUM_CONFIDENCE_THRESHOLD: "0.70"
      YOLO_CONFIDENCE_THRESHOLD: "0.25"
      YOLO_IOU_THRESHOLD: "0.45"
      YOLO_MAX_DETECTIONS: "20"
      YOLO_MODEL_PATH: yolov8n.pt
      YOLO_CLASSES: ""
      CLIP_MODEL_NAME: openai/clip-vit-base-patch32
      RECOGNITION_CANDIDATE_LIMIT: "5"
      REVIEW_STORAGE_DIR: /data/reviews
      YOLO_DATASET_DIR: /code/data/yolo_dataset
      MIN_CROP_DIMENSION_PX: "32"
      MIN_CROP_AREA_RATIO: "0.001"
      REGISTRATION_USE_DETECTOR_CROP: "false"
      REGISTRATION_FALLBACK_TO_FULL_IMAGE: "true"
    ports:
      - "8000:8000"
    volumes:
      - model_cache:/root/.cache
      - ./models:/models
      - ./data:/code/data
      - ./datasets:/code/datasets
      - review_data:/data/reviews
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      DETECTOR_UNCERTAIN_CONFIDENCE_THRESHOLD: "0.45"
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  postgres_data:
  model_cache:
  review_data:
