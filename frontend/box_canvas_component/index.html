<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        font-family: sans-serif;
      }

      .canvas-shell {
        display: inline-block;
        max-width: 100%;
      }

      canvas {
        display: block;
        max-width: 100%;
        height: auto;
        border: 1px solid rgba(148, 163, 184, 0.9);
        box-sizing: border-box;
        cursor: crosshair;
        touch-action: none;
      }

      .hint {
        color: #94a3b8;
        font-size: 13px;
        margin-top: 8px;
      }

      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        color: #cbd5e1;
        font-size: 13px;
        margin-top: 8px;
      }

      .legend-item {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .legend-swatch {
        width: 16px;
        height: 10px;
        border-radius: 2px;
      }

      .existing-swatch {
        border: 2px dashed #2563eb;
        background: rgba(37, 99, 235, 0.12);
      }

      .missing-swatch {
        border: 2px solid #16a34a;
        background: rgba(22, 163, 74, 0.18);
      }
    </style>
  </head>
  <body>
    <div class="canvas-shell">
      <canvas id="box-canvas"></canvas>
      <div class="hint" id="hint">
        Đang tải ảnh vào canvas...
      </div>
      <div class="legend">
        <span class="legend-item">
          <span class="legend-swatch existing-swatch"></span>
          Box AI đã nhận diện
        </span>
        <span class="legend-item">
          <span class="legend-swatch missing-swatch"></span>
          Box người dùng thêm
        </span>
      </div>
    </div>

    <script>
      const Streamlit = {
        RENDER_EVENT: "streamlit:render",
        API_VERSION: 1,
        ready: false,
        setComponentReady() {
          if (!this.ready) {
            window.addEventListener("message", (event) => {
              if (event.data.type === this.RENDER_EVENT) {
                render(event.data.args || {});
              }
            });
            this.ready = true;
          }
          this.send("streamlit:componentReady", { apiVersion: this.API_VERSION });
        },
        setFrameHeight(height) {
          this.send("streamlit:setFrameHeight", { height });
        },
        setComponentValue(value) {
          this.send("streamlit:setComponentValue", {
            value,
            dataType: "json",
          });
        },
        send(type, payload) {
          window.parent.postMessage(
            {
              isStreamlitMessage: true,
              type,
              ...payload,
            },
            "*",
          );
        },
      };

      const canvas = document.getElementById("box-canvas");
      const hint = document.getElementById("hint");
      const ctx = canvas.getContext("2d");
      const image = new Image();
      let args = {};
      let imageLoaded = false;
      let imageError = null;
      let drawing = false;
      let startPoint = null;
      let currentBox = null;
      let existingBoxes = [];
      let selectionCounter = 0;

      function safeMimeType(value) {
        const allowedTypes = new Set(["image/jpeg", "image/png", "image/webp"]);
        return allowedTypes.has(value) ? value : "image/jpeg";
      }

      function normalizeBox(box) {
        const x1 = Math.max(0, Math.min(box[0], box[2], canvas.width));
        const y1 = Math.max(0, Math.min(box[1], box[3], canvas.height));
        const x2 = Math.max(0, Math.min(Math.max(box[0], box[2]), canvas.width));
        const y2 = Math.max(0, Math.min(Math.max(box[1], box[3]), canvas.height));
        return [x1, y1, x2, y2];
      }

      function pointFromEvent(event) {
        const source = event.touches && event.touches.length ? event.touches[0] : event;
        const rect = canvas.getBoundingClientRect();
        return {
          x: (source.clientX - rect.left) * (canvas.width / rect.width),
          y: (source.clientY - rect.top) * (canvas.height / rect.height),
        };
      }

      function drawBox(box) {
        if (!box) {
          return;
        }
        const normalized = normalizeBox(box);
        const x = normalized[0];
        const y = normalized[1];
        const width = normalized[2] - normalized[0];
        const height = normalized[3] - normalized[1];

        ctx.save();
        ctx.fillStyle = "rgba(22, 163, 74, 0.20)";
        ctx.strokeStyle = "#16a34a";
        ctx.lineWidth = 3;
        ctx.fillRect(x, y, width, height);
        ctx.strokeRect(x, y, width, height);
        ctx.restore();
      }

      function drawExistingBox(item) {
        if (!item || !Array.isArray(item.box)) {
          return;
        }
        const normalized = normalizeBox(item.box);
        const x = normalized[0];
        const y = normalized[1];
        const width = normalized[2] - normalized[0];
        const height = normalized[3] - normalized[1];

        ctx.save();
        ctx.strokeStyle = "#2563eb";
        ctx.fillStyle = "rgba(37, 99, 235, 0.08)";
        ctx.lineWidth = 2;
        ctx.setLineDash([8, 5]);
        ctx.fillRect(x, y, width, height);
        ctx.strokeRect(x, y, width, height);
        ctx.setLineDash([]);
        if (item.label) {
          ctx.fillStyle = "#2563eb";
          ctx.fillRect(x, Math.max(0, y - 22), 32, 22);
          ctx.fillStyle = "#ffffff";
          ctx.font = "13px sans-serif";
          ctx.fillText(String(item.label), x + 8, Math.max(14, y - 7));
        }
        ctx.restore();
      }

      function redraw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (imageLoaded) {
          ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
          existingBoxes.forEach(drawExistingBox);
        } else {
          ctx.fillStyle = "#111827";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = "#e5e7eb";
          ctx.font = "16px sans-serif";
          ctx.fillText(imageError || "Đang tải ảnh...", 24, 40);
        }
        drawBox(currentBox);
      }

      function emitBox(box) {
        const normalized = normalizeBox(box);
        selectionCounter += 1;
        Streamlit.setComponentValue({
          selection_id: `${Date.now()}-${selectionCounter}`,
          displayed_box: normalized,
          canvas_box: normalized,
          display_size: [canvas.width, canvas.height],
          x1: normalized[0],
          y1: normalized[1],
          x2: normalized[2],
          y2: normalized[3],
          label: "product",
          product_id: null,
          source: "human_missing_box",
        });
      }

      function startDrawing(event) {
        event.preventDefault();
        if (!imageLoaded) {
          hint.textContent = imageError || "Vui lòng chờ ảnh tải xong trước khi vẽ.";
          return;
        }
        if (event.pointerId !== undefined && canvas.setPointerCapture) {
          canvas.setPointerCapture(event.pointerId);
        }
        drawing = true;
        startPoint = pointFromEvent(event);
        currentBox = [startPoint.x, startPoint.y, startPoint.x, startPoint.y];
        redraw();
      }

      function continueDrawing(event) {
        if (!drawing || !startPoint) {
          return;
        }
        event.preventDefault();
        const point = pointFromEvent(event);
        currentBox = [startPoint.x, startPoint.y, point.x, point.y];
        redraw();
      }

      function finishDrawing(event) {
        if (!drawing || !startPoint) {
          return;
        }
        event.preventDefault();
        const point = pointFromEvent(event);
        currentBox = normalizeBox([startPoint.x, startPoint.y, point.x, point.y]);
        drawing = false;
        startPoint = null;
        redraw();
        emitBox(currentBox);
      }

      function cancelDrawing() {
        if (drawing && currentBox) {
          drawing = false;
          startPoint = null;
          redraw();
          emitBox(currentBox);
        }
      }

      function installCanvasHandlers() {
        if (window.PointerEvent) {
          canvas.addEventListener("pointerdown", startDrawing);
          canvas.addEventListener("pointermove", continueDrawing);
          canvas.addEventListener("pointerup", finishDrawing);
          canvas.addEventListener("pointercancel", cancelDrawing);
          canvas.addEventListener("pointerleave", cancelDrawing);
          return;
        }

        canvas.addEventListener("mousedown", startDrawing);
        canvas.addEventListener("mousemove", continueDrawing);
        canvas.addEventListener("mouseup", finishDrawing);
        canvas.addEventListener("mouseleave", cancelDrawing);

        canvas.addEventListener("touchstart", (event) => {
          event.preventDefault();
          drawing = true;
          startPoint = pointFromEvent(event);
          currentBox = [startPoint.x, startPoint.y, startPoint.x, startPoint.y];
          redraw();
        });

        canvas.addEventListener("touchmove", (event) => {
          event.preventDefault();
          if (!drawing || !startPoint) {
            return;
          }
          const point = pointFromEvent(event);
          currentBox = [startPoint.x, startPoint.y, point.x, point.y];
          redraw();
        });

        canvas.addEventListener("touchend", (event) => {
          event.preventDefault();
          if (!drawing || !startPoint || !currentBox) {
            return;
          }
          currentBox = normalizeBox(currentBox);
          drawing = false;
          startPoint = null;
          redraw();
          emitBox(currentBox);
        });
      }

      function render(nextArgs) {
        args = nextArgs || {};
        const width = Number(args.width || 900);
        const height = Number(args.height || 600);
        const initialBox = Array.isArray(args.initial_box) ? args.initial_box : null;
        const imageBase64 = args.image_base64 || "";
        const mimeType = safeMimeType(args.image_mime_type || "image/jpeg");
        existingBoxes = Array.isArray(args.existing_boxes) ? args.existing_boxes : [];

        canvas.width = width;
        canvas.height = height;
        canvas.style.width = `${width}px`;
        canvas.style.height = "auto";

        currentBox = initialBox ? normalizeBox(initialBox) : currentBox;
        imageLoaded = false;
        imageError = null;
        hint.textContent = "Đang tải ảnh vào canvas...";
        redraw();

        image.onload = () => {
          imageLoaded = true;
          imageError = null;
          hint.textContent =
            "Ảnh đã tải. Kéo chuột để vẽ một box, vẽ lại để thay box hiện tại.";
          redraw();
          Streamlit.setFrameHeight(document.body.scrollHeight + 4);
        };
        image.onerror = () => {
          imageLoaded = false;
          imageError = "Không tải được ảnh nền.";
          hint.textContent = "Không tải được ảnh nền. Hãy thử refresh session.";
          redraw();
          Streamlit.setFrameHeight(document.body.scrollHeight + 4);
        };
        image.src = `data:${mimeType};base64,${imageBase64}`;

        Streamlit.setFrameHeight(document.body.scrollHeight + 4);
      }

      installCanvasHandlers();
      Streamlit.setComponentReady();
      Streamlit.setFrameHeight(document.body.scrollHeight + 4);
    </script>
  </body>
</html>
